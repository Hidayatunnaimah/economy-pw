<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Investasi - nginvest</title>
    <link rel="stylesheet" href="asset/css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>NGINVest</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="tips.html">Tips</a>
        <a href="budget.html">Budget Calculator</a>
        <a href="invest.html">Investment Calculator</a>
        <a href="kontak.html">Kontak</a>
      </nav>
    </header>

    <section class="invest-hero">
      <h2>Kontak Kami</h2>
      <p>
        Mari terhubung dengan kami untuk mendapatkan informasi terbaru tentang
        investasi dan keuangan.
      </p>
    </section>

    <section class="invest-section">
      <div class="invest-card">
        <div class="invest-form">
          <div class="form-group">
            <label for="invest-modal">Nama</label>
            <input
              id="invest-modal"
              type="text"
              placeholder="Contoh: John Doe"
              min="0"
            />
          </div>

          <div class="form-group">
            <label for="invest-return">Nomor Telepon</label>
            <input
              id="invest-return"
              type="number"
              placeholder="Contoh: 089126xxx"
            />
          </div>

          <div class="form-group">
            <label for="invest-duration">Email</label>
            <input
              id="invest-duration"
              type="email"
              placeholder="Contoh: john@mail.com"
            />
          </div>

          <button class="calc-button">Kirim</button>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2025 NGINVest - Kelompok 5</p>
    </footer>
  </body>
</html>
